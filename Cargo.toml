[workspace]
resolver = "2"
members = ["crates/kara-core", "crates/kara-cli"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# ML and DSP code is unusably slow unoptimized; optimize dependencies in dev too.
[profile.dev.package."*"]
opt-level = 3
